<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hexnode Genie · Interactive Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f1f5f9; overflow: hidden; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 20px 60px -10px rgba(59, 130, 246, 0.35), 0 0 0 1px rgba(255,255,255,0.1); }
    50% { box-shadow: 0 25px 70px -10px rgba(139, 92, 246, 0.45), 0 0 0 1px rgba(255,255,255,0.15); }
  }
  @keyframes ping {
    75%, 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  }
  .ping-ring { animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite; }
  .pulse-glow { animation: pulseGlow 4s ease-in-out infinite; }
  .fade-in-up { animation: fadeInUp 0.3s ease-out; }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  pre { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; }
</style>
</head>
<body>

<!-- ROOT -->
<div id="root" class="w-full h-screen overflow-hidden relative">

  <!-- Portal background (image swapped per scene) -->

      <div id="ph-title" class="text-slate-500 text-lg font-semibold mb-1"></div>
      <div id="ph-sub" class="text-slate-400 text-sm mb-4"></div>
      <div class="text-slate-400 text-xs max-w-md italic">
        Drop images <code class="bg-slate-200 px-1.5 py-0.5 rounded">image-1.png</code> through <code class="bg-slate-200 px-1.5 py-0.5 rounded">image-7.png</code> next to index.html.
      </div>
    </div>
    <!-- Right edge gradient for chat contrast -->
    <div class="absolute inset-0 pointer-events-none" style="background: linear-gradient(to right, transparent 0%, transparent 55%, rgba(15,23,42,0.12) 100%);"></div>
  </div>

  <!-- Top bar -->

    <div class="flex items-center gap-2">

  <!-- Final title overlay container -->

// ============================================================
// STATE
// ============================================================
const state = {
  sceneIdx: 0,
  messages: [],
  approvals: {},
  phase: "hotspot", // hotspot | responding | done
  autoAdvanceTimer: null,
  autoAdvanceCancelled: false,
};

function scene() { return SCENES[state.sceneIdx]; }
function isLastScene() { return state.sceneIdx === SCENES.length - 1; }

// ============================================================
// RENDER: scene icons
// ============================================================
function renderSceneNav() {
  const nav = document.getElementById("scene-nav");
  nav.innerHTML = "";

  // Build a stepper: circles connected by lines
  const wrapper = document.createElement("div");
  wrapper.className = "flex items-center gap-0";

  SCENES.forEach((s, i) => {
    const isActive = i === state.sceneIdx;
    const isPast = i < state.sceneIdx;
    const isFuture = i > state.sceneIdx;

    // Step circle
    const stepWrapper = document.createElement("div");
    stepWrapper.className = "relative flex flex-col items-center";

    const circle = document.createElement("button");
    circle.title = `Scene ${s.id}: ${s.title}`;
    circle.className = `relative z-10 flex items-center justify-center transition-all rounded-full ${
      isActive
        ? "w-8 h-8 bg-blue-600 text-white shadow-md shadow-blue-500/40 ring-4 ring-blue-100"
        : isPast
        ? "w-7 h-7 bg-blue-600 text-white hover:bg-blue-700"
        : "w-7 h-7 bg-white border-2 border-slate-300 text-slate-400 hover:border-slate-400 hover:text-slate-600"
    }`;
    circle.onclick = () => jumpToScene(i);

    if (isPast) {
      // Show checkmark for completed steps
      circle.innerHTML = svg("check", "w-3.5 h-3.5");
    } else if (isActive) {
      circle.innerHTML = svg(s.icon, "w-4 h-4");
    } else {
      circle.innerHTML = `<span class="text-[11px] font-bold">${s.id}</span>`;
    }

    stepWrapper.appendChild(circle);
    wrapper.appendChild(stepWrapper);

    // Connecting line (except after last step)
    if (i < SCENES.length - 1) {
      const line = document.createElement("div");
      line.className = `h-0.5 transition-all ${isPast ? "bg-blue-600" : "bg-slate-200"}`;
      line.style.width = "28px";
      wrapper.appendChild(line);
    }
  });

  nav.appendChild(wrapper);

  // Active scene label (right of the stepper)
  const activeScene = SCENES[state.sceneIdx];
  const label = document.createElement("div");
  label.className = "ml-4 flex flex-col";
  label.innerHTML = `
    <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Scene ${activeScene.id} of ${SCENES.length}</div>
    <div class="text-sm font-semibold text-slate-900 leading-tight">${activeScene.title}</div>
  `;
  nav.appendChild(label);

  // Hide the separate scene-counter element (now redundant)
  document.getElementById("scene-counter").textContent = "";
}

// ============================================================
// RENDER: portal background
// ============================================================
function renderPortal() {
  const s = scene();
  const img = document.getElementById("portal-img");
  const ph = document.getElementById("portal-placeholder");
  const file = PORTAL_FILES[s.id];

  // Probe image existence by trying to load
  if (file) {
    const test = new Image();
    test.onload = () => {
      img.src = file;
      img.classList.remove("hidden");
      ph.classList.add("hidden");
    };
    test.onerror = () => {
      img.classList.add("hidden");
      ph.classList.remove("hidden");
      document.getElementById("ph-num").textContent = s.id;
      document.getElementById("ph-title").textContent = s.title;
      document.getElementById("ph-sub").textContent = s.subtitle;
    };
    test.src = file;
  } else {
    img.classList.add("hidden");
    ph.classList.remove("hidden");
  }

  document.getElementById("feature-text").textContent = s.feature;
}

            <div class="flex items-center gap-2 text-xs text-slate-700"><span class="text-emerald-600">${svg("check", "w-3 h-3")}</span> Store #22 remediation script deployed</div>
            <div class="flex items-center gap-2 text-xs text-slate-700"><span class="text-emerald-600">${svg("check", "w-3 h-3")}</span> Compliance risks understood & queued</div>
            <div class="flex items-center gap-2 text-xs text-slate-700"><span class="text-emerald-600">${svg("check", "w-3 h-3")}</span> 47 East iPads locked to Lookbook</div>
            <div class="flex items-center gap-2 text-xs text-slate-700"><span class="text-emerald-600">${svg("check", "w-3 h-3")}</span> 38 West iPads queued for same policy</div>
          </div>
          <button id="closing-trigger" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white text-sm font-semibold py-3 rounded-lg flex items-center justify-center gap-1.5 transition-all">
            See Genie's wrap-up ${svg("chevronRight", "w-4 h-4")}
          </button>
        </div>
      `;
      document.getElementById("closing-trigger").onclick = triggerGenie;
    } else if (state.phase === "done") {
      finalTitle.classList.remove("hidden");
      finalTitle.innerHTML = `
        <div class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm pointer-events-auto"></div>
        <div class="relative text-center px-8 pointer-events-auto fade-in-up">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 mb-6 shadow-2xl shadow-blue-500/30">
            <svg class="w-9 h-9 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.4 7.6L22 10l-7.6 2.4L12 20l-2.4-7.6L2 10l7.6-2.4z"/></svg>
          </div>
          <div class="text-blue-300 text-xs uppercase tracking-[0.3em] font-semibold mb-4">One agent · One conversation</div>
          <div class="text-white text-6xl font-bold mb-4 leading-tight" style="letter-spacing: -0.02em;">This is Hexnode Genie.</div>
          <div class="text-slate-300 text-lg mb-8">From new admin to fleet operator — in one thread.</div>
          <button onclick="resetDemo()" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white text-sm font-semibold px-6 py-2.5 rounded-lg transition-colors">
            Restart demo
          </button>
        </div>
      `;
    }
    return;
  }

  // Regular scenes: hotspot + tooltip when in "hotspot" phase
  if (state.phase !== "hotspot") return;

  const pos = HOTSPOTS[s.id] || { xPct: 50, yPct: 50, tooltipSide: "right" };

  const tooltipStyle = (() => {
    if (pos.tooltipSide === "right") return "left: 32px; top: 50%; transform: translateY(-50%);";
    if (pos.tooltipSide === "left") return "right: 32px; top: 50%; transform: translateY(-50%);";
    if (pos.tooltipSide === "top") return "left: 50%; bottom: 32px; transform: translateX(-50%);";
    if (pos.tooltipSide === "bottom") return "left: 50%; top: 32px; transform: translateX(-50%);";
    return "";
  })();

  layer.innerHTML = `
    <div class="absolute" style="left: ${pos.xPct}%; top: ${pos.yPct}%; transform: translate(-50%, -50%); pointer-events: none;">
      <div class="relative" style="width: 20px; height: 20px;">
        <div class="absolute top-1/2 left-1/2 w-6 h-6 rounded-full bg-blue-500/40 ping-ring" style="transform: translate(-50%, -50%);"></div>
        <div class="absolute top-1/2 left-1/2 w-10 h-10 rounded-full bg-blue-500/15 ping-ring" style="transform: translate(-50%, -50%); animation-delay: 0.4s;"></div>
        <div class="absolute top-1/2 left-1/2 w-5 h-5 rounded-full bg-blue-500 border-2 border-white shadow-lg" style="transform: translate(-50%, -50%); box-shadow: 0 0 20px rgba(59,130,246,0.6);"></div>
      </div>
      <div class="absolute bg-white rounded-xl shadow-2xl border border-slate-200 p-4 fade-in-up" style="${tooltipStyle} width: 320px; pointer-events: auto;">
        <div class="flex items-center gap-2 mb-2">
          <div class="bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded whitespace-nowrap">SCENE ${s.id}</div>
          <div class="text-slate-900 font-semibold text-sm truncate">${s.title}</div>
        </div>
        <div class="text-slate-700 text-sm leading-relaxed mb-3">${s.hotspotLabel}</div>
        <button id="hotspot-next" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 rounded-lg flex items-center justify-center gap-1.5 transition-colors">
          ${isLastScene() ? "Wrap up" : "Watch Genie respond"} ${svg("chevronRight", "w-4 h-4")}
        </button>
      </div>
    </div>
  `;
  document.getElementById("hotspot-next").onclick = triggerGenie;
}

// ============================================================
// RENDER: chat messages
// ============================================================
function renderMessages() {
  const body = document.getElementById("chat-body");
  const empty = document.getElementById("chat-empty");

  if (state.messages.length === 0) {
    empty.classList.remove("hidden");
  } else {
    empty.classList.add("hidden");
  }

  // Keep empty placeholder if no messages
  const existingMessages = body.querySelectorAll("[data-msg-id]");
  existingMessages.forEach(el => el.remove());

  state.messages.forEach(msg => {
    const el = document.createElement("div");
    el.setAttribute("data-msg-id", msg.id);

    if (msg.role === "user") {
      el.className = "flex justify-end mb-4";
      el.innerHTML = `<div class="bg-blue-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 max-w-[85%] text-sm">${escapeHtml(msg.text)}</div>`;
    } else {
      const cardHtml = msg.card && !msg.typing ? renderCard(msg) : "";
      el.className = "flex gap-2 mb-4";
      el.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center flex-shrink-0 text-white">${svg("sparkles", "w-3.5 h-3.5")}</div>
        <div class="max-w-[85%] flex-1">
          <div class="bg-slate-800/90 text-slate-100 rounded-2xl rounded-tl-sm px-4 py-2.5 text-sm leading-relaxed" style="white-space: pre-wrap;">${escapeHtml(msg.text)}${msg.typing ? '<span class="inline-block w-1.5 h-3.5 bg-blue-400 ml-0.5 animate-pulse align-middle"></span>' : ''}</div>
          ${cardHtml}
        </div>
      `;
    }
    body.appendChild(el);
  });

  // Bind approval buttons
  state.messages.forEach(msg => {
    if (msg.card && msg.card.type === "script" && !state.approvals[msg.id] && !msg.typing) {
      const approve = document.querySelector(`[data-approve-id="${msg.id}"]`);
      const deny = document.querySelector(`[data-deny-id="${msg.id}"]`);
      if (approve) approve.onclick = () => handleApprove(msg.id, "script");
      if (deny) deny.onclick = () => handleDeny(msg.id);
    }
    if (msg.card && msg.card.type === "policy-draft" && !state.approvals[msg.id] && !msg.typing) {
      const approve = document.querySelector(`[data-approve-id="${msg.id}"]`);
      const deny = document.querySelector(`[data-deny-id="${msg.id}"]`);
      if (approve) approve.onclick = () => handleApprove(msg.id, "policy");
      if (deny) deny.onclick = () => handleDeny(msg.id);
    }
  });

  body.scrollTop = body.scrollHeight;
}

function renderCard(msg) {
  const c = msg.card;
  const approved = state.approvals[msg.id];

  if (c.type === "policy") {
    return `
      <div class="bg-slate-800/90 border border-blue-500/40 rounded-xl p-4 mt-2">
        <div class="flex items-center gap-2 mb-3 text-blue-400">${svg("shield", "w-4 h-4")}<div class="font-semibold text-sm">${c.title}</div></div>
        <div class="space-y-2">
          ${c.rows.map(([k, v]) => `<div class="flex justify-between text-xs gap-3"><span class="text-slate-400">${k}</span><span class="text-slate-100 font-medium text-right">${v}</span></div>`).join("")}
        </div>
      </div>
    `;
  }
  if (c.type === "diagnosis") {
    return `
      <div class="bg-slate-800/90 border border-red-500/40 rounded-xl p-4 mt-2">
        <div class="flex items-center gap-2 mb-3 text-red-400">${svg("alert", "w-4 h-4")}<div class="font-semibold text-sm">Pattern detected</div></div>
        <div class="space-y-3 text-xs">
          <div><div class="text-slate-400 mb-1">Finding</div><div class="text-slate-100 leading-relaxed">${c.finding}</div></div>
          <div><div class="text-slate-400 mb-1">Root cause</div><div class="text-slate-100 leading-relaxed">${c.rootCause}</div></div>
          <div><div class="text-slate-400 mb-1">Suggested fix</div><ol class="text-slate-100 list-decimal list-inside space-y-1 leading-relaxed">${c.fix.map(f => `<li>${f}</li>`).join("")}</ol></div>
        </div>
      </div>
    `;
  }
  if (c.type === "report") {
    const sev = { high: "text-red-400 bg-red-500/15", medium: "text-amber-400 bg-amber-500/15", low: "text-blue-400 bg-blue-500/15" };
    return `
      <div class="bg-slate-800/90 border border-indigo-500/40 rounded-xl p-4 mt-2">
        <div class="flex items-center gap-2 mb-3 text-indigo-400">${svg("chart", "w-4 h-4")}<div class="font-semibold text-sm">Compliance Report</div></div>
        <div class="text-slate-100 text-sm font-semibold mb-3">${c.summary}</div>
        <div class="space-y-2 mb-3">
          ${c.breakdown.map(b => `
            <div class="flex items-center justify-between text-xs bg-slate-900/80 rounded-lg px-3 py-2">
              <div class="flex-1"><div class="text-slate-100">${b.label}</div><div class="text-slate-500 text-[10px] mt-0.5">${b.note}</div></div>
              <div class="px-2.5 py-1 rounded-md font-bold ${sev[b.severity]}">${b.count}</div>
            </div>
          `).join("")}
        </div>
        <div class="text-xs text-amber-200 bg-amber-500/10 border border-amber-500/30 rounded-lg p-2.5 leading-relaxed"><span class="font-semibold">Priority: </span>${c.priority}</div>
      </div>
    `;
  }
  if (c.type === "script") {
    return `
      <div class="bg-slate-800/90 border border-emerald-500/40 rounded-xl p-4 mt-2">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-emerald-400">${svg("code", "w-4 h-4")}</span>
          <div class="text-emerald-400 font-semibold text-sm">${c.language} Script</div>
          ${approved ? '<div class="ml-auto text-[10px] bg-emerald-500/30 text-emerald-200 px-2 py-1 rounded font-semibold">✓ Deployed</div>' : ''}
        </div>
        <div class="text-xs text-slate-400 mb-1">Scope</div><div class="text-xs text-slate-100 mb-2">${c.scope}</div>
        <div class="text-xs text-slate-400 mb-1">Purpose</div><div class="text-xs text-slate-100 mb-3">${c.purpose}</div>
        <pre class="bg-slate-950 text-emerald-300 text-[10px] p-3 rounded-lg overflow-x-auto leading-relaxed max-h-48 overflow-y-auto">${escapeHtml(c.code)}</pre>
        ${!approved ? `
          <div class="flex gap-2 mt-3">
            <button data-approve-id="${msg.id}" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2 rounded-lg flex items-center justify-center gap-1 transition-colors">${svg("check", "w-3 h-3")} Approve & Run</button>
            <button data-deny-id="${msg.id}" class="px-3 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-semibold py-2 rounded-lg flex items-center justify-center transition-colors">${svg("x", "w-3 h-3")}</button>
          </div>
        ` : ""}
      </div>
    `;
  }
  if (c.type === "policy-draft") {
    return `
      <div class="bg-slate-800/90 border border-purple-500/40 rounded-xl p-4 mt-2">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-purple-400">${svg("lock", "w-4 h-4")}</span>
          <div class="text-purple-400 font-semibold text-sm">${c.name}</div>
          ${approved ? '<div class="ml-auto text-[10px] bg-emerald-500/30 text-emerald-200 px-2 py-1 rounded font-semibold">✓ Deployed</div>' : '<div class="ml-auto text-[10px] bg-amber-500/20 text-amber-300 px-2 py-1 rounded font-semibold">Draft</div>'}
        </div>
        <div class="text-xs text-slate-400 mb-1">Target</div><div class="text-xs text-slate-100 mb-3">${c.target}</div>
        <div class="space-y-1.5 mb-3">
          ${c.settings.map(s => `<div class="flex justify-between text-xs"><span class="text-slate-400">${s.label}</span><span class="font-medium ${s.flag ? 'text-red-300' : 'text-slate-100'}">${s.value}</span></div>`).join("")}
        </div>
        ${!approved ? `
          <div class="flex gap-2">
            <button data-approve-id="${msg.id}" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold py-2 rounded-lg flex items-center justify-center gap-1 transition-colors">${svg("check", "w-3 h-3")} Approve & Deploy</button>
            <button data-deny-id="${msg.id}" class="px-3 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-semibold py-2 rounded-lg flex items-center justify-center transition-colors">${svg("x", "w-3 h-3")}</button>
          </div>
        ` : ""}
      </div>
    `;
  }
  return "";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ============================================================
// ACTIONS
// ============================================================
function triggerGenie() {
  state.phase = "responding";
  renderHotspot();

  const s = scene();

  if (s.isClosing) {
    setTimeout(() => {
      const id = `m-${Date.now()}`;
      state.messages.push({ id, role: "assistant", text: "", typing: true });
      renderMessages();
      typeMessage(id, "Day one wrap-up:\n\n✓ Store #14 Wi-Fi diagnosed\n✓ 6 compliance failures identified & resolution queued\n✓ Fleet compliance report generated\n✓ Store #22 POS recovery script deployed\n✓ 47 East-region iPads locked to Lookbook\n✓ 38 West-region iPads queued for same policy\n\nAll from one conversation. That's Hexnode Genie.", null, () => {
        state.phase = "done";
        renderHotspot();
        updateNextButton();
        // No auto-advance on closing scene
      });
    }, 300);
    return;
  }

  if (state.sceneIdx === 0) {
    setTimeout(() => {
      const id = `m-${Date.now()}`;
      state.messages.push({ id, role: "assistant", text: "", typing: true });
      renderMessages();
      typeMessage(id, s.intro, null, onGenieFinished);
    }, 300);
  } else {
    setTimeout(() => {
      typeUserPrompt(s.userPrompt, () => {
        setTimeout(() => {
          const id = `m-${Date.now()}`;
          state.messages.push({ id, role: "assistant", text: "", typing: true, card: null });
          renderMessages();
          typeMessage(id, s.response.text, s.response.card, onGenieFinished);
        }, 400);
      });
    }, 300);
  }
}

function typeUserPrompt(text, onDone) {
  const input = document.getElementById("user-input");
  const indicator = document.getElementById("typing-indicator");
  indicator.classList.remove("hidden");
  let i = 0;
  const interval = setInterval(() => {
    i++;
    input.value = text.slice(0, i);
    if (i >= text.length) {
      clearInterval(interval);
      setTimeout(() => {
        const id = `u-${Date.now()}`;
        state.messages.push({ id, role: "user", text });
        renderMessages();
        input.value = "";
        indicator.classList.add("hidden");
        onDone && onDone();
      }, 300);
    }
  }, USER_TYPE_SPEED);
}

function typeMessage(id, text, card, onDone) {
  let i = 0;
  const interval = setInterval(() => {
    i++;
    const msg = state.messages.find(m => m.id === id);
    if (msg) msg.text = text.slice(0, i);
    renderMessages();
    if (i >= text.length) {
      clearInterval(interval);
      const m = state.messages.find(x => x.id === id);
      if (m) {
        m.typing = false;
        m.card = card;
      }
      renderMessages();
      onDone && onDone();
    }
  }, TYPE_SPEED);
}

function handleApprove(msgId, kind) {
  state.approvals[msgId] = true;
  renderMessages();
  hideApprovalHint();
  showToast(kind === "policy" ? "Policy deployed to target devices" : "Script executed successfully");
  // Now that approval is done, kick off auto-advance to the next scene
  startAutoAdvance();
}
function handleDeny() {
  hideApprovalHint();
  showToast("Action cancelled");
  // Denying does not auto-advance — presenter chooses what to do next
}

function showToast(message) {
  const container = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = "fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/40 text-white px-5 py-4 rounded-xl shadow-2xl flex items-center gap-3";
  el.style.minWidth = "320px";
  el.style.animation = "slideIn 0.3s ease-out";
  el.innerHTML = `
    <div class="bg-emerald-500/20 p-2 rounded-lg text-emerald-400">${svg("check", "w-5 h-5")}</div>
    <div class="text-sm font-medium">${message}</div>
  `;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function onGenieFinished() {
  state.phase = "done";
  renderHotspot();
  updateNextButton();

  // If the latest Genie message has a card that requires approval,
  // wait for the user to click Approve before auto-advancing.
  const lastMsg = [...state.messages].reverse().find(m => m.role === "assistant" && m.card);
  const requiresApproval = lastMsg && lastMsg.card &&
    (lastMsg.card.type === "script" || lastMsg.card.type === "policy-draft");

  if (requiresApproval) {
    showApprovalHint();
    return;
  }

  startAutoAdvance();
}

function showApprovalHint() {
  let el = document.getElementById("approval-hint");
  if (!el) {
    el = document.createElement("div");
    el.id = "approval-hint";
    el.className = "fixed bottom-6 right-6 z-50 bg-slate-900 border border-amber-500/40 text-white rounded-xl shadow-2xl px-4 py-3 flex items-center gap-3";
    el.style.minWidth = "280px";
    el.style.animation = "slideIn 0.3s ease-out";
    document.body.appendChild(el);
  }
  el.innerHTML = `
    <div class="bg-amber-500/20 text-amber-300 p-2 rounded-lg">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <div class="flex-1">
      <div class="text-xs text-amber-300 font-semibold uppercase tracking-wider">Waiting for human approval</div>
      <div class="text-sm text-white">Click <span class="font-semibold">Approve</span> in the chat to deploy.</div>
    </div>
  `;
}

function hideApprovalHint() {
  const el = document.getElementById("approval-hint");
  if (el) el.remove();
}

function updateNextButton() {
  const btn = document.getElementById("btn-next-scene");
  if (state.phase === "done" && !isLastScene()) {
    btn.classList.remove("hidden");
    btn.classList.add("flex");
    btn.style.animation = "fadeInUp 0.3s ease-out";
  } else {
    btn.classList.add("hidden");
    btn.classList.remove("flex");
  }
}

function startAutoAdvance() {
  // Don't auto-advance on the last (closing) scene
  if (isLastScene()) return;

  state.autoAdvanceCancelled = false;
  const startTime = Date.now();
  const total = AUTO_ADVANCE_MS;

  // Render countdown immediately
  renderCountdown(total);

  state.autoAdvanceTimer = setInterval(() => {
    if (state.autoAdvanceCancelled) {
      clearInterval(state.autoAdvanceTimer);
      state.autoAdvanceTimer = null;
      hideCountdown();
      return;
    }
    const elapsed = Date.now() - startTime;
    const remaining = total - elapsed;
    if (remaining <= 0) {
      clearInterval(state.autoAdvanceTimer);
      state.autoAdvanceTimer = null;
      hideCountdown();
      nextScene();
    } else {
      renderCountdown(remaining);
    }
  }, 100);
}

function cancelAutoAdvance() {
  state.autoAdvanceCancelled = true;
  if (state.autoAdvanceTimer) {
    clearInterval(state.autoAdvanceTimer);
    state.autoAdvanceTimer = null;
  }
  hideCountdown();
}

function renderCountdown(remainingMs) {
  let el = document.getElementById("auto-advance-countdown");
  if (!el) {
    el = document.createElement("div");
    el.id = "auto-advance-countdown";
    el.className = "fixed bottom-6 right-6 z-50 bg-slate-900 border border-blue-500/40 text-white rounded-xl shadow-2xl px-4 py-3 flex items-center gap-3";
    el.style.minWidth = "260px";
    el.style.animation = "slideIn 0.3s ease-out";
    document.body.appendChild(el);
  }
  const seconds = Math.ceil(remainingMs / 1000);
  const progress = 1 - (remainingMs / AUTO_ADVANCE_MS);
  el.innerHTML = `
    <div class="relative w-8 h-8 flex-shrink-0">
      <svg class="w-8 h-8 transform -rotate-90" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="14" fill="none" stroke="#1e293b" stroke-width="3"/>
        <circle cx="18" cy="18" r="14" fill="none" stroke="#3b82f6" stroke-width="3"
          stroke-dasharray="${2 * Math.PI * 14}"
          stroke-dashoffset="${2 * Math.PI * 14 * (1 - progress)}"
          stroke-linecap="round"
          style="transition: stroke-dashoffset 0.1s linear;"/>
      </svg>
      <div class="absolute inset-0 flex items-center justify-center text-xs font-bold">${seconds}</div>
    </div>
    <div class="flex-1">
      <div class="text-xs text-slate-400">Auto-advancing in ${seconds}s</div>
      <div class="text-sm font-medium">Next: ${SCENES[state.sceneIdx + 1] ? SCENES[state.sceneIdx + 1].title : ""}</div>
    </div>
    <button id="cancel-auto" class="text-slate-400 hover:text-white text-xs px-2 py-1 rounded hover:bg-slate-800 transition-colors">Pause</button>
  `;
  document.getElementById("cancel-auto").onclick = cancelAutoAdvance;
}

function hideCountdown() {
  const el = document.getElementById("auto-advance-countdown");
  if (el) el.remove();
}

function nextScene() {
  if (isLastScene()) return;
  cancelAutoAdvance();
  hideApprovalHint();
  state.sceneIdx += 1;
  state.phase = "hotspot";
  renderAll();
  updateNextButton();
}

function jumpToScene(idx) {
  cancelAutoAdvance();
  hideApprovalHint();
  state.sceneIdx = idx;
  state.phase = "hotspot";
  renderAll();
  updateNextButton();
}

function resetDemo() {
  cancelAutoAdvance();
  hideApprovalHint();
  state.sceneIdx = 0;
  state.messages = [];
  state.approvals = {};
  state.phase = "hotspot";
  document.getElementById("user-input").value = "";
  renderAll();
  updateNextButton();
}

function renderAll() {
