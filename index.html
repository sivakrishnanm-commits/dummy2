<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Demos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .demos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .demo-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .demo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .demo-card h2 {
            color: #333;
            margin-bottom: 12px;
            font-size: 1.5em;
        }

        .demo-card p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
            flex-grow: 1;
        }

        .demo-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .demo-card .tag {
            display: inline-block;
            background: #f0f0f0;
            color: #667eea;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .demo-card a {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
            align-self: flex-start;
        }

        .demo-card a:hover {
            opacity: 0.9;
        }

        .loading {
            color: white;
            text-align: center;
            font-size: 1.1em;
        }

        .error {
            background: white;
            color: #e74c3c;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .demos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Interactive Demos</h1>
            <p>Explore our interactive product demonstrations</p>
        </div>

        <div id="demos-container" class="loading">Loading demos...</div>
    </div>

    <script>
        async function loadDemos() {
            try {
                const response = await fetch('./demos.json');
                if (!response.ok) throw new Error('Failed to load demos');
                
                const demos = await response.json();
                renderDemos(demos);
            } catch (error) {
                document.getElementById('demos-container').innerHTML = `
                    <div class="error">
                        <p>Error loading demos. Make sure <code>demos.json</code> exists in the root directory.</p>
                        <p style="margin-top: 10px; font-size: 0.9em;">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        function renderDemos(demos) {
            const container = document.getElementById('demos-container');
            
            if (!demos || demos.length === 0) {
                container.innerHTML = '<div class="error"><p>No demos available yet. Add demos to demos.json</p></div>';
                return;
            }

            container.className = 'demos-grid';
            container.innerHTML = demos.map(demo => `
                <div class="demo-card">
                    <div>
                        <h2>${demo.title}</h2>
                        <p>${demo.description}</p>
                        ${demo.tags ? `
                            <div class="tags">
                                ${demo.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <a href="${demo.url}" target="_blank">View Demo →</a>
                </div>
            `).join('');
        }

        loadDemos();
    </script>
</body>
</html>
