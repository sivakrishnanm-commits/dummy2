<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Demos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #020A19 0%, #0F1B2E 50%, #1a2f4a 100%);
            min-height: 100vh;
            padding: 60px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 60, 245, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(235, 243, 254, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 80px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 3.5em;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #EBF3FE 0%, #FFFFFF 50%, #EBF3FE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 1.1em;
            color: rgba(235, 243, 254, 0.7);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .demos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 32px;
            margin-bottom: 60px;
        }

        .demo-card {
            background: rgba(235, 243, 254, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(235, 243, 254, 0.15);
            border-radius: 20px;
            padding: 32px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 60, 245, 0.08);
        }

        .demo-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 0%, rgba(0, 60, 245, 0.1) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .demo-card:hover {
            transform: translateY(-12px);
            background: rgba(235, 243, 254, 0.12);
            border-color: rgba(0, 60, 245, 0.3);
            box-shadow: 0 20px 64px 0 rgba(0, 60, 245, 0.15),
                        inset 0 1px 0 0 rgba(235, 243, 254, 0.2);
        }

        .demo-card:hover::before {
            opacity: 1;
        }

        .demo-card h2 {
            color: #FFFFFF;
            margin-bottom: 12px;
            font-size: 1.6em;
            font-weight: 600;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 2;
        }

        .demo-card p {
            color: rgba(235, 243, 254, 0.8);
            margin-bottom: 24px;
            line-height: 1.7;
            flex-grow: 1;
            font-weight: 300;
            font-size: 0.95em;
            position: relative;
            z-index: 2;
        }

        .demo-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        .demo-card .tag {
            display: inline-block;
            background: rgba(0, 60, 245, 0.15);
            color: #EBF3FE;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
            border: 1px solid rgba(0, 60, 245, 0.25);
            transition: all 0.3s ease;
        }

        .demo-card .tag:hover {
            background: rgba(0, 60, 245, 0.25);
            border-color: rgba(0, 60, 245, 0.4);
        }

        .demo-card a {
            display: inline-block;
            background: linear-gradient(135deg, #003CF5 0%, #0051E3 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            align-self: flex-start;
            border: 1px solid rgba(0, 60, 245, 0.3);
            position: relative;
            z-index: 2;
            font-size: 0.95em;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(0, 60, 245, 0.25);
        }

        .demo-card a:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 60, 245, 0.4),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #0051E3 0%, #003CF5 100%);
        }

        .demo-card a:active {
            transform: translateY(0);
        }

        .loading {
            color: rgba(235, 243, 254, 0.9);
            text-align: center;
            font-size: 1.1em;
            font-weight: 300;
        }

        .error {
            background: rgba(235, 243, 254, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #FF6B6B;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(235, 243, 254, 0.1);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2em;
            }

            .header p {
                font-size: 1em;
            }

            .demos-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .demo-card {
                padding: 24px;
            }

            body {
                padding: 40px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Interactive Demos</h1>
            <p>Explore our interactive product demonstrations</p>
        </div>

        <div id="demos-container" class="loading">Loading demos...</div>
    </div>

    <script>
        async function loadDemos() {
            try {
                const response = await fetch('./demos.json');
                if (!response.ok) throw new Error('Failed to load demos');
                
                const demos = await response.json();
                renderDemos(demos);
            } catch (error) {
                document.getElementById('demos-container').innerHTML = `
                    <div class="error">
                        <p>Error loading demos. Make sure <code>demos.json</code> exists in the root directory.</p>
                        <p style="margin-top: 10px; font-size: 0.9em;">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        function renderDemos(demos) {
            const container = document.getElementById('demos-container');
            
            if (!demos || demos.length === 0) {
                container.innerHTML = '<div class="error"><p>No demos available yet. Add demos to demos.json</p></div>';
                return;
            }

            container.className = 'demos-grid';
            container.innerHTML = demos.map(demo => `
                <div class="demo-card">
                    <div>
                        <h2>${demo.title}</h2>
                        <p>${demo.description}</p>
                        ${demo.tags ? `
                            <div class="tags">
                                ${demo.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <a href="${demo.url}" target="_blank">View Demo →</a>
                </div>
            `).join('');
        }

        loadDemos();
    </script>
</body>
</html>
