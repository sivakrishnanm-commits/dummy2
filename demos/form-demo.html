<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        input.error {
            border-color: #e74c3c;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 0.85em;
            margin-top: 5px;
            display: none;
        }
        .success-msg {
            color: #27ae60;
            font-size: 0.85em;
            margin-top: 5px;
            display: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Form Validation Demo</h1>
        <form id="demoForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
                <div class="error-msg">Please enter a valid email</div>
                <div class="success-msg">✓ Valid email</div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="(123) 456-7890">
                <div class="error-msg">Please enter a valid phone number</div>
                <div class="success-msg">✓ Valid phone</div>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="4" placeholder="Your message here..."></textarea>
                <div class="error-msg">Message must be at least 10 characters</div>
                <div class="success-msg">✓ Message looks good</div>
            </div>

            <button type="submit">Submit</button>
        </form>
        <a href="../">← Back to Demos</a>
    </div>

    <script>
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        const message = document.getElementById('message');
        const form = document.getElementById('demoForm');

        function validateEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function validatePhone(value) {
            return /^\d{10,}$/.test(value.replace(/\D/g, ''));
        }

        function validateMessage(value) {
            return value.length >= 10;
        }

        function showValidation(input, isValid) {
            const errorMsg = input.nextElementSibling;
            const successMsg = errorMsg.nextElementSibling;

            if (input.value === '') {
                input.classList.remove('error');
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';
            } else if (isValid) {
                input.classList.remove('error');
                errorMsg.style.display = 'none';
                successMsg.style.display = 'block';
            } else {
                input.classList.add('error');
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
            }
        }

        email.addEventListener('input', () => showValidation(email, validateEmail(email.value)));
        phone.addEventListener('input', () => showValidation(phone, validatePhone(phone.value)));
        message.addEventListener('input', () => showValidation(message, validateMessage(message.value)));

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (validateEmail(email.value) && validatePhone(phone.value) && validateMessage(message.value)) {
                alert('✓ Form submitted successfully!');
                form.reset();
                [email, phone, message].forEach(input => {
                    input.classList.remove('error');
                    input.nextElementSibling.style.display = 'none';
                    input.nextElementSibling.nextElementSibling.style.display = 'none';
                });
            } else {
                alert('Please fix the form errors');
            }
        });
    </script>
</body>
</html>
